<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C1A20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WeDrink">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>WeDrink Check-In</title>
<style>
  :root{--bg:#0C1A20;--panel:#132630;--panel2:#16303A;--line:rgba(80,190,180,.18);
        --tx:#E9F3F1;--mut:#8AA6A0;--teal:#37D7D0;--green:#2ec878;--amber:#F2A03D;
        --red:#E25B4D;--blue:#5db4ff;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:
    radial-gradient(700px 380px at 10% -10%, rgba(55,215,208,.14) 0%, transparent 55%),
    radial-gradient(640px 340px at 110% -8%, rgba(242,160,61,.12) 0%, transparent 55%),
    linear-gradient(160deg,#0C1A20 0%,#0A1519 60%,#0B1A1E 100%);
    color:var(--tx);min-height:100vh;min-height:100dvh}
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
  header img{width:46px;height:46px;border-radius:13px}
  header h1{font-size:20px;line-height:1.1}
  header .sub{color:var(--mut);font-size:12px;margin-top:2px}
  .card{background:linear-gradient(165deg,rgba(22,44,52,.94),rgba(15,32,38,.94));
    border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;
    box-shadow:0 10px 28px rgba(0,0,0,.3)}
  label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:600}
  select{width:100%;padding:14px;background:#0c1720;border:1px solid var(--line);
    border-radius:12px;color:var(--tx);font-size:16px;font-weight:600;appearance:none}
  .shift{border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:12px;
    padding:11px 13px;margin:8px 0;background:rgba(9,20,24,.55);font-size:14px}
  .shift b{font-size:15px}
  .shift .st{font-size:12.5px;margin-top:3px}
  .ok{color:#67E0A3}.late{color:#F2C070}.mut{color:var(--mut)}.blue{color:var(--blue)}
  .bigbtn{width:100%;min-height:60px;border:none;border-radius:15px;font-size:17px;
    font-weight:700;cursor:pointer;margin-top:6px;touch-action:manipulation}
  .btn-in{background:linear-gradient(135deg,#37D7D0,#1C9C96);color:#06231f;
    box-shadow:0 8px 22px rgba(55,215,208,.32)}
  .btn-brk{background:rgba(255,255,255,.08);color:var(--tx);border:1px solid var(--line)}
  .btn-res{background:linear-gradient(135deg,#6fc3ff,#3d8fd6);color:#0b1c2e;
    box-shadow:0 8px 22px rgba(110,195,255,.28)}
  .bigbtn:disabled{opacity:.55}
  #msg{margin-top:12px;font-size:14.5px;line-height:1.55;min-height:20px}
  .kpi{display:flex;gap:8px;margin-top:10px}
  .kpi div{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:12px;padding:9px;text-align:center}
  .kpi b{display:block;font-size:17px;color:var(--teal)}
  .kpi span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .foot{text-align:center;color:#5F776F;font-size:11.5px;margin-top:16px;line-height:1.7}
  #installTip{display:none;background:rgba(55,215,208,.1);border:1px dashed rgba(55,215,208,.35);
    border-radius:12px;padding:10px 13px;font-size:12.5px;color:#B9CEC9;margin-bottom:14px}
  #installBtn{display:none;width:100%;margin-bottom:14px;background:rgba(242,160,61,.16);
    border:1px solid rgba(242,160,61,.4);color:#F2C070;min-height:48px;border-radius:12px;
    font-weight:700;font-size:14px}
  .pulse{animation:pu 2s ease-in-out infinite}
  @keyframes pu{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon-192.png" alt="">
    <div>
      <h1>WeDrink Check-In 🧋</h1>
      <div class="sub" id="clock">…</div>
    </div>
  </header>

  <button id="installBtn">📲 Install this app on your phone</button>
  <div id="installTip">📲 <b>iPhone:</b> tap Share <span style="font-size:15px">⎋</span> →
    <b>Add to Home Screen</b> to install this as an app.</div>

  <div class="card">
    <label>Your name</label>
    <select id="who"><option value="">— select your name —</option></select>
    <input id="pin" type="tel" inputmode="numeric" maxlength="4" placeholder="Your 4-digit PIN"
      style="display:none;width:100%;padding:13px;margin-top:9px;background:#0c1720;
      border:1px solid rgba(80,190,180,.3);border-radius:12px;color:#E9F3F1;font-size:17px;
      letter-spacing:6px;text-align:center;font-weight:700">
    <div id="shifts"></div>
    <div id="action"></div>
    <div id="msg"></div>
  </div>

  <div class="foot">📍 Your location is captured only when you tap a button, and only used to
    confirm you're at the branch.<br>WeDrink Sabah · Aeropod · Lintas Plaza · Beverly Hills</div>
</div>

<script>
/* ===== config (mirror of the dashboard's rules) ===== */
var SB_URL="https://njrokrqqvmoevvfhjbju.supabase.co";
var SB_KEY="sb_publishable_n3HBjj9fPb9HbyOdmTiBHw_lYCTw_PI";
/* fallback only — real geofences load from Supabase `sites` at startup */
var SITES={ "Aeropod":{lat:5.950203,lng:116.060190,radius:100,label:"WEDRINK Aeropod"},
            "Lintas":{lat:5.946709,lng:116.087965,radius:100,label:"WEDRINK Lintas Plaza"},
            "Beverly":{lat:5.938874,lng:116.101648,radius:100,label:"WEDRINK Beverly Hills"} };
function loadSites(){
  return GET('sites?select=*').then(function(rows){
    if(!Array.isArray(rows)) return;
    rows.forEach(function(r){
      if(!SITES[r.branch]) SITES[r.branch]={label:r.branch};
      SITES[r.branch].lat=r.lat; SITES[r.branch].lng=r.lng;
      SITES[r.branch].radius=r.radius_m;
      SITES[r.branch].configured=r.configured;
    });
  }).catch(function(){});
}
var EARLY_MIN=15, BREAK_MIN=60, GRACE_MIN=5, MAX_ACC=150, TZ_OFF=8*60; /* MYT = UTC+8 */
var PINS={};
function sha256(s){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))
  .then(function(buf){ return Array.from(new Uint8Array(buf))
    .map(function(x){return ('0'+x.toString(16)).slice(-2);}).join(''); }); }

/* ===== tiny supabase REST ===== */
function H(extra){ var h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,
  'Content-Type':'application/json'}; if(extra)Object.assign(h,extra); return h; }
function GET(p){ return fetch(SB_URL+'/rest/v1/'+p,{headers:H()}).then(function(r){return r.json();}); }
function POST(p,body,extra){ return fetch(SB_URL+'/rest/v1/'+p,
  {method:'POST',headers:H(extra),body:JSON.stringify(body)}); }
function PATCH(p,body){ return fetch(SB_URL+'/rest/v1/'+p,
  {method:'PATCH',headers:H({Prefer:'return=minimal'}),body:JSON.stringify(body)}); }

/* ===== trusted clock: server time + local elapsed ===== */
var srvBase=null, srvAt=null;
function syncClock(){
  return fetch(SB_URL+'/rest/v1/rpc/server_now',{method:'POST',headers:H(),body:'{}'})
    .then(function(r){return r.json();})
    .then(function(iso){ srvBase=new Date(iso).getTime(); srvAt=Date.now(); })
    .catch(function(){ srvBase=Date.now(); srvAt=Date.now(); });
}
function nowUTCms(){ return srvBase===null ? Date.now() : srvBase + (Date.now()-srvAt); }
function mytNow(){ return new Date(nowUTCms() + TZ_OFF*60000); }   /* read as UTC fields */
function mytToday(){ return mytNow().toISOString().slice(0,10); }
function mytMin(){ var d=mytNow(); return d.getUTCHours()*60 + d.getUTCMinutes(); }
function hhmm(m){ m=((Math.round(m)%1440)+1440)%1440;
  return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2); }
function toMin(s){ var p=String(s||'').split(':'); return (+p[0])*60+(+p[1]||0); }
function hav(a,b,c,d){ var R=6371000,q=Math.PI/180;
  var x=Math.sin((c-a)*q/2), y=Math.sin((d-b)*q/2);
  var h=x*x+Math.cos(a*q)*Math.cos(c*q)*y*y; return 2*R*Math.asin(Math.sqrt(h)); }

function preciseHint(acc){
  return '<br><b>Your phone is only giving an approximate location (±'+acc+' m), not real GPS.</b><br>📱 <b>iPhone:</b> Settings ▸ Privacy &amp; Security ▸ Location Services ▸ <i>Safari Websites</i> (or WeDrink) ▸ turn ON <b>Precise Location</b>, then tap again.<br>📱 <b>Android:</b> Settings ▸ Location ▸ turn on <b>Google Location Accuracy</b>.';
}
function logFail(reason, who, sh, dist, acc, la, ln){
  try{
    POST('checkin_failures', [{work_date:(state.today||mytToday()), employee:who||'',
      branch:(sh&&sh.location)||null, action:'checkin', reason:reason,
      distance_m:(dist==null?null:dist), accuracy_m:(acc==null?null:acc),
      lat:(la==null?null:la), lng:(ln==null?null:ln),
      device:navigator.userAgent.slice(0,120)}], {Prefer:'return=minimal'});
  }catch(e){}
}

/* ===== state ===== */
var whoSel=document.getElementById('who'), shiftsEl=document.getElementById('shifts'),
    actionEl=document.getElementById('action'), msgEl=document.getElementById('msg');
var state={shifts:[],checkins:[],breaks:[],today:null,yday:null};
function say(html,cls){ msgEl.className=cls||''; msgEl.innerHTML=html; }

var pinEl=document.getElementById('pin');
function togglePin(){
  pinEl.style.display = (whoSel.value && (PINS[whoSel.value]||'')) ? 'block' : 'none';
}
function loadNames(){
  GET('employees?select=name,pin&order=name').then(function(rows){
    var names=[];
    (rows||[]).forEach(function(r){ PINS[r.name]=(r.pin||'').trim(); names.push(r.name); });
    names.forEach(function(n){
      var o=document.createElement('option'); o.value=n; o.textContent=n; whoSel.appendChild(o);
    });
    var saved=localStorage.getItem('wd_name');
    if(saved && names.indexOf(saved)>=0){ whoSel.value=saved; refresh(); }
    togglePin();
  });
}

function ydayOf(iso){
  var d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()-1);
  return d.toISOString().slice(0,10);
}
function refresh(){
  var who=whoSel.value;
  shiftsEl.innerHTML=''; actionEl.innerHTML=''; say('');
  if(!who) return;
  localStorage.setItem('wd_name', who);
  var today=mytToday();
  state.today=today; state.yday=ydayOf(today);
  /* Load YESTERDAY too: a night shift ending 00:00 must stay clock-out-able
     after midnight, once "today" has already rolled over. */
  var days='in.('+state.yday+','+today+')', emp=encodeURIComponent(who);
  Promise.all([
    GET('shifts?select=*&work_date='+days+'&employee=eq.'+emp+'&order=work_date,start_time'),
    GET('check_ins?select=*&work_date='+days+'&employee=eq.'+emp),
    GET('breaks?select=*&work_date='+days+'&employee=eq.'+emp)
  ]).then(function(res){
    state.shifts=res[0]||[]; state.checkins=res[1]||[]; state.breaks=res[2]||[];
    render(who);
  }).catch(function(){ say('Network problem — pull down to refresh.','late'); });
}

function ciFor(sh){ return state.checkins.find(function(c){
  return c.shift===sh.shift && c.work_date===sh.work_date; }); }
/* when a shift ends, in ms - overnight shifts end on the NEXT day */
function shiftEndMs(sh){
  var s=toMin(sh.start_time), e=toMin(sh.end_time);
  var base=new Date(sh.work_date+'T00:00:00Z').getTime() - TZ_OFF*60000;
  return base + (e<=s ? e+1440 : e)*60000;
}
function brList(sh){ return state.breaks.filter(function(b){
    return b.shift===sh.shift && b.work_date===sh.work_date; })
  .sort(function(a,b){return (a.break_no||1)-(b.break_no||1);}); }

function render(who){
  var today=state.today||mytToday(), nmin=mytMin();

  /* Carried-over shift: checked in, not clocked out, from an earlier day.
     Stays actionable for 8 h after it ended, so a 00:00 finish can still be
     clocked out once the date has rolled over. */
  var carry=null;
  state.shifts.forEach(function(sh){
    if(sh.work_date===today) return;
    var ci=ciFor(sh);
    if(!ci || ci.clock_out) return;
    if(nowUTCms() > shiftEndMs(sh)+8*3600000) return;
    if(!carry || shiftEndMs(sh)>shiftEndMs(carry)) carry=sh;
  });
  if(carry){
    var cci=ciFor(carry);
    shiftsEl.innerHTML='<div class="shift" style="border-left-color:#F2A03D">'+
      '<b>'+(SITES[carry.location]?SITES[carry.location].label:carry.location)+'</b> · '+
      carry.shift+' · '+carry.start_time+'–'+carry.end_time+
      '<div class="st"><span class="late">⏳ still open from '+carry.work_date.slice(5)+
      '</span> · <span class="ok">✓ in '+String(cci.clock_in).slice(11,16)+
      '</span></div></div>';
    sessionUI(who, carry, cci, true);
    return;
  }

  state.shifts=state.shifts.filter(function(sh){ return sh.work_date===today; });
  if(!state.shifts.length){
    shiftsEl.innerHTML='<div class="shift" style="border-left-color:#5F776F">'+
      '<b>No shift today</b><div class="st mut">Enjoy your rest day 🌴 — if that\'s wrong, ask your admin.</div></div>';
    return;
  }
  var html='';
  state.shifts.forEach(function(sh){
    var ci=ciFor(sh), st;
    if(ci){
      var late=ci.minutes_late||0;
      st = late>0 ? '<span class="late">✓ in '+String(ci.clock_in).slice(11,16)+' · ⏰ '+late+' min late</span>'
                  : '<span class="ok">✓ in '+String(ci.clock_in).slice(11,16)+' · on time</span>';
      if(ci.clock_out) st += ' <span class="mut">· ⏹ out '+String(ci.clock_out).slice(11,16)+'</span>';
    } else {
      st='<span class="mut">not checked in · opens '+hhmm(toMin(sh.start_time)-EARLY_MIN)+'</span>';
    }
    html+='<div class="shift"><b>'+(SITES[sh.location]?SITES[sh.location].label:sh.location)+
          '</b> · '+sh.shift+' · '+sh.start_time+'–'+sh.end_time+'<div class="st">'+st+'</div></div>';
  });
  shiftsEl.innerHTML=html;

  /* pick target: first un-checked-in shift whose window opened */
  var target=null, soonest=null;
  for(var i=0;i<state.shifts.length;i++){
    var sh=state.shifts[i];
    if(ciFor(sh)) continue;
    var openM=toMin(sh.start_time)-EARLY_MIN;
    if(nmin>=openM){ target=sh; break; }
    if(!soonest||openM<toMin(soonest.start_time)-EARLY_MIN) soonest=sh;
  }
  if(target){
    var lateBy=Math.max(0, nmin-toMin(target.start_time));
    actionEl.innerHTML='<button class="bigbtn btn-in" id="ci">📍 Check in now'+
      (lateBy>0?' <small>('+lateBy+' min late)</small>':'')+'</button>';
    document.getElementById('ci').onclick=function(){ doCheckin(who,target); };
    return;
  }
  if(soonest){
    say('⏳ Check-in for your '+soonest.shift+' shift ('+soonest.start_time+') opens at <b>'+
        hhmm(toMin(soonest.start_time)-EARLY_MIN)+'</b>.','mut');
    return;
  }
  /* all checked in -> break machine + clock-out on the latest shift */
  sessionUI(who, state.shifts[state.shifts.length-1],
            ciFor(state.shifts[state.shifts.length-1]), false);
}

function sessionUI(who, cur, curCi, carried){
  if(curCi && curCi.clock_out){
    say('🏁 Shift complete — in '+String(curCi.clock_in).slice(11,16)+', out '+
        String(curCi.clock_out).slice(11,16)+'. See you next shift! 🧋','ok');
    return;
  }
  var brs=brList(cur);
  var active=null;
  for(var k=0;k<brs.length;k++){ if(!brs[k].resume_at){ active=brs[k]; break; } }
  if(active){
    var el=Math.max(0,Math.round((nowUTCms()-new Date(active.break_start).getTime())/60000));
    var left=BREAK_MIN-el;
    var dueM=(toMinFromTs(active.break_start)+BREAK_MIN)%1440;
    var bl=(active.break_no||1)===1?'1st':'2nd';
    say(left>=0 ? '☕ On your '+bl+' break for <b>'+el+' min</b> — resume by <b>'+hhmm(dueM)+'</b> ('+left+' min left).'
                : '☕ '+bl+' break <b>'+el+' min</b> — <b class="late">'+(-left)+' min over!</b> Head back and tap Resume.',
        left>=0?'blue':'late');
    actionEl.innerHTML='<button class="bigbtn btn-res" id="br">🔙 Resume — I\'m back at the shop</button>';
    document.getElementById('br').onclick=function(){ doResume(who,cur,active); };
    return;
  }
  var doneTxt='';
  brs.forEach(function(b){
    var dur=Math.round((new Date(b.resume_at)-new Date(b.break_start))/60000);
    var over=b.minutes_over||0;
    doneTxt+='☕ Break '+(b.break_no||1)+': '+dur+' min'+
      (over>GRACE_MIN?' <span class="late">(+'+over+')</span>':' ✅')+' &nbsp; ';
  });
  if(doneTxt) say(doneTxt,'mut');
  var btns='';
  if(brs.length<2){
    btns+='<button class="bigbtn btn-brk" id="bs">☕ Start my '+(brs.length===0?'':'2nd ')+
          'break ('+BREAK_MIN+' min)</button>';
  }
  btns+='<button class="bigbtn" id="co" style="background:linear-gradient(135deg,#e2635b,#c74438);color:#fff;box-shadow:0 8px 22px rgba(226,99,91,.28)">🔴 Clock out — end my shift</button>';
  actionEl.innerHTML=btns;
  if(brs.length<2){
    document.getElementById('bs').onclick=function(){ startBreak(who,cur,brs.length+1); };
  }
  document.getElementById('co').onclick=function(){ doClockOut(who,cur,curCi); };
}
function toMinFromTs(ts){ var d=new Date(new Date(ts).getTime()+TZ_OFF*60000);
  return d.getUTCHours()*60+d.getUTCMinutes(); }

/* ===== actions ===== */
function getGPS(cb, failCtx){
  if(!navigator.geolocation){ say('This device does not support GPS.','late');
    logFail('no_geolocation', failCtx&&failCtx.who, failCtx&&failCtx.sh); return; }
  say('<span class="pulse">Getting your location…</span>','mut');
  navigator.geolocation.getCurrentPosition(function(pos){
    cb(pos.coords.latitude, pos.coords.longitude, Math.round(pos.coords.accuracy));
  }, function(err){
    var t={1:'Location permission denied — please allow location for this app, then tap again. '+
             '(iPhone: Settings ▸ Privacy ▸ Location Services ▸ Safari/WeDrink ▸ While Using)',
           2:'Position unavailable — step near a window or outside and tap again.',
           3:'Timed out — please tap again.'};
    logFail(({1:'permission_denied',2:'position_unavailable',3:'gps_timeout'})[err.code]||'gps_error',
            failCtx&&failCtx.who, failCtx&&failCtx.sh);
    say(t[err.code]||('Location error: '+err.message),'late');
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:0});
}

function doCheckin(who, sh){
  var site=SITES[sh.location];
  if(!site){ say('Branch geofence not configured.','late'); return; }
  var needPin=(PINS[who]||'');
  if(needPin){
    var pv=(pinEl.value||'').trim();
    if(!pv){ say('Enter your 4-digit PIN first — this confirms it\'s really you.','late'); return; }
    sha256(pv).then(function(h){
      sha256(needPin).then(function(h2){
        if(h!==h2){ say('Wrong PIN — check with your admin if you forgot it.','late'); return; }
        reallyCheckin(who, sh, site);
      });
    });
    return;
  }
  reallyCheckin(who, sh, site);
}
function reallyCheckin(who, sh, site){
  getGPS(function(lat,lng,acc){
    if(acc>MAX_ACC){ logFail('weak_gps',who,sh,null,acc,lat,lng);
      say(preciseHint(acc),'late'); return; }
    var dist=Math.round(hav(lat,lng,site.lat,site.lng));
    if(dist>site.radius){ logFail('too_far',who,sh,dist,acc,lat,lng);
      say('You are about <b>'+dist+' m</b> from '+site.label+
      ' (must be within '+site.radius+' m).'+
      (acc>60 ? preciseHint(acc) : ' Move closer and retry.'),'late'); return; }
    var nmin=mytMin(), openM=toMin(sh.start_time)-EARLY_MIN;
    if(nmin<openM){ logFail('too_early',who,sh,dist,acc,lat,lng);
      say('Too early — opens at '+hhmm(openM)+'.','late'); return; }
    var late=Math.max(0, Math.round(nmin-toMin(sh.start_time)));
    var wd=sh.work_date||state.today;
    var stamp=wd+' '+hhmm(nmin);
    say('<span class="pulse">Saving your check-in…</span>','mut');
    POST('check_ins?on_conflict=work_date,employee,shift',
      [{work_date:wd, employee:who, branch:sh.location, shift:sh.shift,
        shift_start:sh.start_time, clock_in:stamp, lat:+lat.toFixed(6), lng:+lng.toFixed(6),
        accuracy_m:acc, distance_m:dist, minutes_late:late}],
      {Prefer:'resolution=ignore-duplicates,return=minimal'})
    .then(function(r){
      if(r.status===201||r.status===200||r.status===204){
        say('✓ <b>'+who+'</b> checked in at <b>'+stamp+'</b> · '+site.label+' · '+
            (late>0?'⏰ '+late+' min late':'✅ on time')+' · '+dist+' m from the shop.','ok');
        setTimeout(refresh,1200);
      } else { say('Could not save — please tap again. ('+r.status+')','late'); }
    }).catch(function(){ logFail('network_error',who,sh,dist,acc,lat,lng);
      say('Network problem — check connection and tap again.','late'); });
  }, {who:who, sh:sh});
}

function startBreak(who, sh, breakNo){
  POST('breaks?on_conflict=work_date,employee,shift,break_no',
    [{work_date:(sh.work_date||state.today), employee:who, shift:sh.shift, break_no:(breakNo||1)}],
    {Prefer:'resolution=ignore-duplicates,return=minimal'})
  .then(function(r){
    if(r.status===201||r.status===200||r.status===204){
      say('☕ Break started — see you in '+BREAK_MIN+' minutes!','blue');
      setTimeout(refresh,800);
    } else { say('Could not start break. ('+r.status+')','late'); }
  }).catch(function(){ say('Network problem — tap again.','late'); });
}

function doResume(who, sh, br){
  var site=SITES[sh.location];
  getGPS(function(lat,lng,acc){
    if(acc>MAX_ACC){ say('GPS signal too weak (±'+acc+' m). Retry near a window.','late'); return; }
    var dist=Math.round(hav(lat,lng,site.lat,site.lng));
    if(dist>site.radius){ say('You are about <b>'+dist+' m</b> from '+site.label+
      ' (must be within '+site.radius+' m to resume). Move closer and retry.','late'); return; }
    var el=(nowUTCms()-new Date(br.break_start).getTime())/60000;
    var over=Math.max(0, Math.round(el-BREAK_MIN));
    say('<span class="pulse">Saving…</span>','mut');
    PATCH('breaks?work_date=eq.'+(br.work_date||sh.work_date||state.today)+'&employee=eq.'+encodeURIComponent(who)+
          '&shift=eq.'+encodeURIComponent(sh.shift)+'&break_no=eq.'+(br.break_no||1),
      {resume_at:new Date(nowUTCms()).toISOString(), resume_lat:+lat.toFixed(6),
       resume_lng:+lng.toFixed(6), resume_acc:acc, resume_dist:dist, minutes_over:over})
    .then(function(r){
      if(r.status===200||r.status===204){
        say('✓ Welcome back! Break was <b>'+Math.round(el)+' min</b> · '+
            (over<=GRACE_MIN?'✅ within break time':'⏰ <b>'+over+' min</b> over')+
            ' · '+dist+' m from the shop.','ok');
        setTimeout(refresh,1200);
      } else { say('Could not save — tap again. ('+r.status+')','late'); }
    }).catch(function(){ say('Network problem — tap again.','late'); });
  });
}

function doClockOut(who, sh, ci){
  var site=SITES[sh.location];
  getGPS(function(lat,lng,acc){
    if(acc>MAX_ACC){ say('GPS signal too weak (±'+acc+' m). Retry near a window.','late'); return; }
    var dist=Math.round(hav(lat,lng,site.lat,site.lng));
    if(dist>site.radius){ say('You are about <b>'+dist+' m</b> from '+site.label+
      ' (must be within '+site.radius+' m to clock out). Move closer and retry.','late'); return; }
    var nmin=mytMin(), wd=sh.work_date||state.today;
    /* stamp on the SHIFT's own day: a 00:05 finish belongs to that shift */
    var stamp=wd+' '+hhmm(nmin);
    say('<span class="pulse">Saving…</span>','mut');
    PATCH('check_ins?work_date=eq.'+wd+'&employee=eq.'+encodeURIComponent(who)+
          '&shift=eq.'+encodeURIComponent(sh.shift),
      {clock_out:stamp, co_lat:+lat.toFixed(6), co_lng:+lng.toFixed(6),
       co_acc:acc, co_dist:dist})
    .then(function(r){
      if(r.status===200||r.status===204){
        var worked='';
        try{
          var inM=toMin(String(ci.clock_in).slice(11,16));
          var w=(Math.round(nmin)-inM+1440)%1440;
          worked=' · worked '+Math.floor(w/60)+'h '+(w%60)+'m';
        }catch(e){}
        say('✓ Clocked out at <b>'+stamp+'</b>'+worked+'. See you next shift! 🧋','ok');
        setTimeout(refresh,1200);
      } else { say('Could not save — tap again. ('+r.status+')','late'); }
    }).catch(function(){ say('Network problem — tap again.','late'); });
  });
}

/* ===== clock line + boot ===== */
function tickClock(){
  var d=mytNow();
  document.getElementById('clock').textContent =
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()]+' '+
    d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]+
    ' · '+hhmm(d.getUTCHours()*60+d.getUTCMinutes())+' (Sabah time)';
}
whoSel.onchange=function(){ togglePin(); refresh(); };
function wake(){ syncClock().then(function(){ tickClock(); if(whoSel.value) refresh(); }); }
document.addEventListener('visibilitychange', function(){ if(!document.hidden) wake(); });
window.addEventListener('pageshow', function(e){ if(e.persisted) wake(); });
window.addEventListener('focus', wake);
syncClock().then(function(){ tickClock(); loadSites().then(loadNames); });
setInterval(tickClock,15000);
setInterval(function(){ if(whoSel.value) refresh(); },30000);

/* ===== install UX ===== */
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('installBtn').style.display='block';
});
document.getElementById('installBtn').onclick=function(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null;
    this.style.display='none'; }
};
(function(){
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(isIOS && !standalone) document.getElementById('installTip').style.display='block';
})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
